# Service Bus lab: the Service Bus emulator and the SQL Server it stores its state in.
# Development and test only. ACCEPT_EULA=Y accepts both EULAs (verify.sh sets it).
name: servicebus-lab

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA=Y to accept the SQL Server and Service Bus emulator EULAs}
      MSSQL_SA_PASSWORD: "Emulator-Only-Passw0rd!"

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    depends_on:
      - mssql
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "Emulator-Only-Passw0rd!"
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA=Y}
    ports:
      - "5672:5672"   # AMQP: send, receive, settle
      - "5300:5300"   # management (ServiceBusAdministrationClient) and /health
