# Local services for the learning-path experiments that need them (PeekLock, SeekVsScan, and any
# experiment folder with a `requires-docker` marker file).
# Development and test only. ACCEPT_EULA=Y accepts the SQL Server and Service Bus emulator EULAs
# (verify.sh sets it; set it yourself if you run compose by hand: ACCEPT_EULA=Y docker compose up -d).
name: learning-path

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA=Y to accept the SQL Server and Service Bus emulator EULAs}
      MSSQL_SA_PASSWORD: "Emulator-Only-Passw0rd!"
    ports:
      - "14330:1433"           # 14330, so it doesn't collide with a SQL Server you already run

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    depends_on:
      - mssql
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "Emulator-Only-Passw0rd!"
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA=Y}
    ports:
      - "5672:5672"
      - "5300:5300"
