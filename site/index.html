<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.NET Handbook</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Toggle navigation" title="Toggle navigation">☰</button>
    <div class="brand" id="brandHome">.NET Handbook</div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search chapters…" aria-label="Search chapters…" autocomplete="off" spellcheck="false">
      <div id="searchResults" class="search-results" hidden></div>
    </div>
    <div class="top-actions">
      <button id="outlineBtn" class="icon-btn" aria-label="On this page" title="On this page" aria-expanded="false" aria-controls="outline" hidden>§</button>
      <label class="switch" id="languageSwitch" title="Switch site language">
        <input type="checkbox" id="languageToggle" role="switch" aria-label="Ukrainian site language">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-lbl">EN / УКР</span>
      </label>
      <!-- Reading settings: theme, text size and font. Labels are localized by app.js. -->
      <div class="reader-wrap">
        <button id="readerBtn" class="icon-btn" title="Reading settings" aria-label="Reading settings"
                aria-expanded="false" aria-controls="readerPanel">Aa</button>
        <div id="readerPanel" class="reader-panel" role="group" aria-label="Reading settings" hidden>
          <div class="rp-row">
            <div class="rp-lbl" id="rpThemeLbl">Theme</div>
            <div class="seg" role="group" aria-labelledby="rpThemeLbl">
              <button type="button" id="theme-auto" aria-pressed="false">Auto</button>
              <button type="button" id="theme-light" aria-pressed="false">Light</button>
              <button type="button" id="theme-paper" aria-pressed="false">Paper</button>
              <button type="button" id="theme-dark" aria-pressed="false">Dark</button>
            </div>
            <p class="rp-hint" id="rpThemeHint">Light and Paper suit a lit room; Dark suits a dim room at night. Auto follows your device.</p>
          </div>
          <div class="rp-row">
            <div class="rp-lbl" id="rpSizeLbl">Text size</div>
            <div class="stepper" role="group" aria-labelledby="rpSizeLbl">
              <button type="button" id="sizeDown" title="Smaller text" aria-label="Smaller text">A−</button>
              <output id="sizeValue" aria-live="polite">100%</output>
              <button type="button" id="sizeUp" title="Larger text" aria-label="Larger text">A+</button>
            </div>
          </div>
          <div class="rp-row">
            <div class="rp-lbl" id="rpFontLbl">Font</div>
            <div class="seg" role="group" aria-labelledby="rpFontLbl">
              <button type="button" id="font-sans" aria-pressed="false" title="Segoe UI · San Francisco · Roboto">Sans</button>
              <button type="button" id="font-wide" aria-pressed="false" title="Verdana">Wide</button>
              <button type="button" id="font-serif" aria-pressed="false" title="Georgia">Serif</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Learning paths: which part of the book the sidebar lists. Filled by app.js from BOOK. -->

  <!-- Sidebar navigation -->
  <nav id="sidebar" aria-label="Table of contents">
    <div id="nav"></div>
  </nav>
  <!-- In-chapter section outline. A fixed right rail on wide screens; a right-hand drawer
       (the § button, or a right-to-left swipe) once the rail no longer fits. -->
  <div id="outline" role="navigation" aria-label="On this page"></div>
  <div id="scrim"></div>

  <!-- Main content -->
  <main id="main">
    <div id="reading-progress"></div>
    <article id="content"></article>
    <nav id="pager" class="pager"></nav>
    <footer id="footer">
      <p id="footerText">Self-contained handbook · available offline in English and Ukrainian.</p>
    </footer>
  </main>
</div>

<!-- "What's New" release popup — shown once per release (tracked in localStorage) -->
<div id="wnModal" class="modal" hidden>
  <div class="modal-card wn-card">
    <h3>🆕 <span id="wnTitle">What's new</span> — <span id="wnDate"></span></h3>
    <div id="wnBody" class="wn-body"></div>
    <div class="modal-actions">
      <button id="wnOpen" class="btn ghost">Open the What's New page</button>
      <button id="wnClose" class="btn">Got it</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
